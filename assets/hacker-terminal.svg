      <text x="300" y="254" fill="#00E676">[░░░░░░░░░░░░░░]  0/40<animate attributeName="opacity" calcMode="discrete" dur="3s" repeatCount="indefinite" values="1;0" keyTimes="0;0.34"/></text>
      <text x="300" y="254" fill="#00E676">[▓▓▓▓▓▓▓░░░░░░░]  8/40<animate attributeName="opacity" calcMode="discrete" dur="3s" repeatCount="indefinite" values="0;1;0" keyTimes="0;0.34;0.67"/></text>
      <text x="300" y="254" fill="#00E676">[▓▓▓▓▓▓▓▓▓▓▓▓░░] 17/40<animate attributeName="opacity" calcMode="discrete" dur="3s" repeatCount="indefinite" values="0;0;1" keyTimes="0;0.34;0.67"/></text>
      <animate attributeName="opacity" dur="14s" repeatCount="indefinite" values="0;0;1;1;1;0" keyTimes="0;0.343;0.393;0.945;0.99;1"/>
    </g>

