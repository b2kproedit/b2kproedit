    <g opacity="0">
      <text x="88" y="228" fill="#00E676" font-weight="700">$</text>
      <text x="106" y="228" fill="#E6EDF3">./run.sh --challenge "40-days-of-web-dev"</text>
      <animate attributeName="opacity" dur="14s" repeatCount="indefinite" values="0;0;1;1;1;0" keyTimes="0;0.286;0.336;0.945;0.99;1"/>
    </g>

