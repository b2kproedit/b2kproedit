      <animate attributeName="opacity" dur="14s" repeatCount="indefinite" values="0;0;1;1;1;0" keyTimes="0;0.514;0.564;0.945;0.99;1"/>
    </g>

    <!-- 10: status + blinking cursor -->
    <g opacity="0">
      <text x="88" y="374" fill="#00E676" font-weight="700">$</text>
      <text x="106" y="374" fill="#E6EDF3">status --now</text>
      <animate attributeName="opacity" dur="14s" repeatCount="indefinite" values="0;0;1;1;1;0" keyTimes="0;0.571;0.621;0.945;0.99;1"/>
