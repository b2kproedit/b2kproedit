      <text x="205" y="280" fill="#2ECC71">✔</text><text x="225" y="280" fill="#8B949E">quiz-game</text>
      <text x="320" y="280" fill="#2ECC71">✔</text><text x="340" y="280" fill="#8B949E">e-commerce</text>
