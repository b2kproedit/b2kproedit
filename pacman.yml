name: Generate Pacman Contribution Graph

on:
  schedule:
    - cron: "0 0 * * *"     # runs once a day
  workflow_dispatch: {}      # lets you trigger it manually

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Generate Pacman contribution graph
        uses: Platane/snk@v3
        id: pacman-graph
        with:
          github_user_name: brukjone
          outputs: |
            dist/pacman-contribution-graph.svg?color_dots=#00ff00,#00ff00,#00ff00,#00ff00,#00ff00&color_snake=blue,orange,orange,orange,orange&game=pacman
            dist/pacman-contribution-graph-dark.svg?palette=github-dark&game=pacman

      - name: Push generated SVG to the pacman-output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: pacman-output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
